<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="160" viewBox="0 0 520 160" role="img"
     aria-label="Hack The Box profile card for finsecguy, HTB CDSA">
  <title>Hack The Box · finsecguy · HTB CDSA</title>
  <desc>Hand-written profile card. Official HTB badge images do not support the new UUID profile URL.</desc>

  <defs>
    <linearGradient id="htb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10151C"/>
      <stop offset="55%" stop-color="#0B0C14"/>
      <stop offset="100%" stop-color="#0F1A16"/>
    </linearGradient>
    <linearGradient id="htb-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9FEF00"/>
      <stop offset="45%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#9FEF00;#A78BFA" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="aurora-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="htb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card -->
  <rect x="1.5" y="1.5" width="517" height="157" rx="14" fill="url(#htb-bg)" stroke="url(#htb-border)" stroke-width="2"/>

  <!-- Soft green glow in the left well -->
  <ellipse cx="78" cy="80" rx="70" ry="56" fill="#9FEF00" opacity="0.08">
    <animate attributeName="opacity" values="0.06;0.14;0.06" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Original isometric cube motif (not official HTB artwork) -->
  <g transform="translate(40 42)" filter="url(#htb-glow)">
    <!-- top -->
    <polygon points="38,0 76,22 38,44 0,22" fill="#C6FF4D"/>
    <!-- left -->
    <polygon points="0,22 38,44 38,88 0,66" fill="#6FBF00"/>
    <!-- right -->
    <polygon points="38,44 76,22 76,66 38,88" fill="#9FEF00"/>
  </g>

  <!-- Identity -->
  <text x="132" y="48" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="11" font-weight="700" letter-spacing="2.2" fill="#9FEF00">HACK THE BOX</text>
  <text x="132" y="82" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="700" fill="#F8FAFC">finsecguy</text>
  <text x="132" y="104" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="500" fill="#94A3B8">Herman K. · HTB Certified Defensive Security Analyst</text>

  <!-- Pills -->
  <g transform="translate(132 118)">
    <rect x="0" y="0" width="86" height="22" rx="11" fill="#9FEF00"/>
    <text x="43" y="16" text-anchor="middle"
          font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="11" font-weight="700" fill="#0B0C14">HTB CDSA</text>

    <rect x="96" y="0" width="108" height="22" rx="11" fill="none" stroke="#22D3EE" stroke-width="1.4"/>
    <text x="150" y="16" text-anchor="middle"
          font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="11" font-weight="700" fill="#22D3EE">View profile</text>
  </g>
</svg>
